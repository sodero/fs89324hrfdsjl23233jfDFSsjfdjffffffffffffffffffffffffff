<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jack the fix</title>
<style>
  html, body { margin: 0; height: 100%; background: #d6d4cf; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c');
let ctx = c.getContext('2d'); // swapped briefly while pre-rendering sprites

const TAU = Math.PI * 2;
const INK = '#16110f', PAPER = '#f2ead6', WHITE = '#fffdf4', SKY = '#d6d4cf';
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (a) => a[(Math.random() * a.length) | 0];
const chance = (p) => Math.random() < p;

let W, H, dpr, B, LW, SPEED, boil = 0;
const POLE_F = 0.65; // the poles and their cables scroll in a layer of their own, just behind the front row
let layers = [], streams = {};

// ---------- ink helpers ----------

// static noise, and "boiling" noise for the hand-drawn wobble of things that move
const h0 = (n) => { const s = Math.sin(n * 127.1 + 17.3) * 43758.5453; return (s - Math.floor(s)) * 2 - 1; };
const hb = (n) => h0(n + boil * 7.13);
const rectPts = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
const polyClip = (pts) => () => { ctx.moveTo(pts[0][0], pts[0][1]); for (const p of pts) ctx.lineTo(p[0], p[1]); ctx.closePath(); };

function smooth(pts, closed) {
  const n = pts.length, mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  if (closed) {
    const s = mid(pts[n - 1], pts[0]); ctx.moveTo(s[0], s[1]);
    for (let i = 0; i < n; i++) { const q = mid(pts[i], pts[(i + 1) % n]); ctx.quadraticCurveTo(pts[i][0], pts[i][1], q[0], q[1]); }
    ctx.closePath();
  } else {
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < n - 1; i++) { const q = mid(pts[i], pts[i + 1]); ctx.quadraticCurveTo(pts[i][0], pts[i][1], q[0], q[1]); }
    ctx.lineTo(pts[n - 1][0], pts[n - 1][1]);
  }
}

function ellPts(x, y, rx, ry, { rot = 0, lump = 0.02, seed = 0 } = {}) {
  const n = Math.max(10, Math.min(48, Math.round((rx + ry) / 5)));
  const amp = Math.min(LW * 0.5, (rx + ry) * 0.02), cr = Math.cos(rot), sr = Math.sin(rot), pts = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU;
    const r = 1 + lump * (Math.sin(3 * a + seed) * 0.6 + Math.sin(5 * a + seed * 2.3) * 0.4);
    const px = Math.cos(a) * rx * r + hb(seed + i) * amp, py = Math.sin(a) * ry * r + hb(seed + i + 50) * amp;
    pts.push([x + px * cr - py * sr, y + px * sr + py * cr]);
  }
  return pts;
}

function ink(pts, { closed = true, fill, w = LW } = {}) {
  ctx.beginPath(); smooth(pts, closed);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (w) { ctx.lineWidth = w; ctx.strokeStyle = INK; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(); }
}

// a wobbly quadratic stroke
function stroke(x0, y0, cx, cy, x1, y1, w, seed) {
  const pts = [], n = 6, amp = LW * 0.4;
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t, j = i && i < n ? 1 : 0.3;
    pts.push([u * u * x0 + 2 * u * t * cx + t * t * x1 + hb(seed + i) * amp * j, u * u * y0 + 2 * u * t * cy + t * t * y1 + hb(seed + i + 9) * amp * j]);
  }
  ink(pts, { closed: false, w });
}

// wobbly straight-edged outline (ink() would round off the corners)
function inkPoly(pts, { closed = true, fill, w = LW } = {}) {
  const n = pts.length, segs = closed ? n : n - 1;
  ctx.beginPath();
  for (let i = 0; i < segs; i++) {
    const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % n];
    const k = Math.max(1, Math.round(Math.hypot(bx - ax, by - ay) / 25));
    for (let j = 0; j < k; j++) {
      const t = j / k, jit = j ? LW * 0.35 : 0, sd = ax * 0.13 + ay * 0.71 + j * 3.1;
      const x = ax + (bx - ax) * t + hb(sd) * jit, y = ay + (by - ay) * t + hb(sd + 1.7) * jit;
      if (i || j) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    }
  }
  if (closed) ctx.closePath(); else ctx.lineTo(pts[n - 1][0], pts[n - 1][1]);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (w) { ctx.lineWidth = w; ctx.strokeStyle = INK; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(); }
}
const line = (x0, y0, x1, y1, w) => inkPoly([[x0, y0], [x1, y1]], { closed: false, w });

// scratchy parallel hatching inside the clip paths
function hatch(clips, x, y, r, ang, gap, w, seed) {
  ctx.save();
  for (const c of clips) { ctx.beginPath(); c(); ctx.clip(); }
  ctx.strokeStyle = INK; ctx.lineWidth = w; ctx.lineCap = 'round';
  const dx = Math.cos(ang), dy = Math.sin(ang);
  ctx.beginPath();
  for (let o = -r, i = 0; o <= r; o += gap, i++) {
    const a = o + hb(seed + i) * gap * 0.3, b = o + hb(seed + i + 0.5) * gap * 0.3;
    ctx.moveTo(x - dx * r - dy * a, y - dy * r + dx * a);
    ctx.lineTo(x + dx * r - dy * b, y + dy * r + dx * b);
  }
  ctx.stroke();
  ctx.restore();
}
const shadeRect = (x, y, w, h, seed, ang = 1) => hatch([() => ctx.rect(x, y, w, h)], x + w / 2, y + h / 2, (w + h) / 2 + 2, ang, LW * 1.4, LW * 0.45, seed);

// an outlined pipe: thick ink stroke with a lighter core
function pipeLine(pts, d, fill = PAPER) {
  ctx.lineJoin = 'round'; ctx.lineCap = 'butt';
  ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  ctx.strokeStyle = INK; ctx.lineWidth = d + LW * 0.9; ctx.stroke();
  ctx.strokeStyle = fill; ctx.lineWidth = d; ctx.stroke();
}

function cable(x0, y0, x1, y1, sag, w = LW * 0.5) {
  ctx.strokeStyle = INK; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo((x0 + x1) / 2, (y0 + y1) / 2 + sag, x1, y1); ctx.stroke();
}

function signBoard(cx, cy, text, size, dark, maxW = Infinity) {
  ctx.font = `bold ${size}px "Trebuchet MS", Verdana, sans-serif`;
  let tw = ctx.measureText(text).width;
  if (tw + size > maxW) { size *= maxW / (tw + size); ctx.font = `bold ${size}px "Trebuchet MS", Verdana, sans-serif`; tw = ctx.measureText(text).width; }
  const bw = tw + size, bh = size * 1.5;
  inkPoly(rectPts(cx - bw / 2, cy - bh / 2, bw, bh), { fill: dark ? INK : WHITE, w: LW * 0.9 });
  ctx.fillStyle = dark ? WHITE : INK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, cx, cy + size * 0.05);
}

function sittingCat(x, y, k, dir, fill = INK) {
  stroke(x - dir * 0.5 * k, y, x - dir * 1.9 * k, y - 0.1 * k, x - dir * 1.6 * k, y - 1.3 * k, LW * 0.8, x);
  ink(ellPts(x, y - 1.1 * k, 0.85 * k, 1.15 * k, { seed: x }), { fill, w: LW * 0.6 });
  ink(ellPts(x + dir * 0.25 * k, y - 2.55 * k, 0.62 * k, 0.55 * k, { seed: x + 1 }), { fill, w: LW * 0.6 });
  for (const e of [-0.45, 0.25]) inkPoly([[x + dir * e * k, y - 2.8 * k], [x + dir * (e + 0.15) * k, y - 3.45 * k], [x + dir * (e + 0.45) * k, y - 2.95 * k]], { fill, w: LW * 0.5 });
  if (fill === INK) { ctx.fillStyle = '#f4f0a0'; for (const e of [0.05, 0.5]) { ctx.beginPath(); ctx.arc(x + dir * e * k, y - 2.6 * k, 0.12 * k, 0, TAU); ctx.fill(); } }
}

// CCTV camera on a wall bracket at (x, y), looking out and down in direction dir
function camera(x, y, dir, k) {
  const thin = LW * 0.45, a = 0.35, fx = dir * Math.cos(a), fy = Math.sin(a), dx = -dir * Math.sin(a), dy = Math.cos(a);
  const jx = x + dir * 1.1 * k, jy = y;
  const P = (f, d) => [jx + fx * f + dx * d, jy + fy * f + dy * d];
  inkPoly(rectPts(x - 0.15 * k, y - 0.6 * k, 0.3 * k, 1.2 * k), { fill: PAPER, w: thin });
  line(x, y, jx, jy, thin * 1.8);
  line(x, y + 0.5 * k, jx - dir * 0.2 * k, jy, thin);
  inkPoly([P(-0.6 * k, -1.05 * k), P(1.8 * k, -1.05 * k), P(1.8 * k, -0.15 * k), P(-0.6 * k, -0.15 * k)], { fill: WHITE, w: thin * 1.2 });
  inkPoly([P(-0.4 * k, -1.35 * k), P(2.3 * k, -1.35 * k), P(2.3 * k, -1.05 * k), P(-0.4 * k, -1.05 * k)], { fill: INK, w: thin });
  const [lx, ly] = P(1.85 * k, -0.6 * k);
  ink(ellPts(lx, ly, 0.2 * k, 0.4 * k, { rot: dir * a, seed: lx }), { fill: INK, w: 0 });
  const [cx, cy] = P(-0.6 * k, -0.6 * k);
  cable(cx, cy, x, y - 0.3 * k, 0.6 * k, thin * 0.8);
}

// dome camera hanging under a ledge at (x, y)
function dome(x, y, k) {
  inkPoly(rectPts(x - 0.75 * k, y - 0.25 * k, 1.5 * k, 0.25 * k), { fill: PAPER, w: LW * 0.4 });
  ctx.beginPath(); ctx.ellipse(x, y, 0.6 * k, 0.55 * k, 0, 0, Math.PI); ctx.closePath();
  ctx.fillStyle = INK; ctx.fill();
  ctx.fillStyle = WHITE; ctx.beginPath(); ctx.arc(x + 0.2 * k, y + 0.2 * k, 0.1 * k, 0, TAU); ctx.fill();
}

// a coil of razor wire sitting on y, from x0 to x1
function razorWire(x0, x1, y, r) {
  ctx.strokeStyle = INK; ctx.lineWidth = LW * 0.35;
  ctx.beginPath();
  for (let x = x0 + r * 0.6; x < x1 - r * 0.3; x += r * 0.55) { ctx.moveTo(x + r * 0.6, y - r); ctx.ellipse(x, y - r, r * 0.6, r, 0, 0, TAU); }
  ctx.stroke();
  ctx.beginPath();
  for (let x = x0 + r * 0.3; x < x1; x += r * 0.35) { const yy = y - r + Math.sin(x * 3.1) * r * 0.9; ctx.moveTo(x - r * 0.12, yy - r * 0.12); ctx.lineTo(x + r * 0.12, yy + r * 0.12); }
  ctx.stroke();
}

// a sagging strand of barbed wire
function barbedWire(x0, y0, x1, y1, sag, gap) {
  cable(x0, y0, x1, y1, sag, LW * 0.4);
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2 + sag, d = LW * 0.6, step = gap / Math.max(1, Math.hypot(x1 - x0, y1 - y0));
  ctx.beginPath();
  for (let t = step / 2; t < 1; t += step) {
    const v = 1 - t, x = v * v * x0 + 2 * v * t * cx + t * t * x1, y = v * v * y0 + 2 * v * t * cy + t * t * y1;
    ctx.moveTo(x - d, y - d); ctx.lineTo(x + d, y + d); ctx.moveTo(x - d, y + d); ctx.lineTo(x + d, y - d);
  }
  ctx.stroke();
}

// ---------- dirt ----------

// smudges, soot, muck from the street, rain streaks and cracks over a wall from y = top to y = bottom
function grime(x0, x1, top, bottom, u, amt = 1) {
  const ww = x1 - x0, hh = bottom - top, thin = LW * 0.45;
  if (ww <= 0 || hh <= 0) return;
  ctx.save();
  ctx.beginPath(); ctx.rect(x0, top, ww, hh); ctx.clip();
  for (let i = 0, n = 1 + Math.round(ww * hh / (45 * u * u) * amt); i < n; i++) {
    const cx = rand(x0, x1), cy = rand(top, bottom), r = rand(1.5, 5) * u;
    ctx.globalAlpha = rand(0.05, 0.15);
    ink(ellPts(cx, cy, r, r * rand(0.5, 1.3), { lump: 0.3, seed: cx + cy }), { fill: INK, w: 0 });
  }
  ctx.globalAlpha = Math.min(1, amt);
  const soot = ctx.createLinearGradient(0, top, 0, top + 7 * u);
  soot.addColorStop(0, 'rgba(22,17,15,0.3)'); soot.addColorStop(1, 'rgba(22,17,15,0)');
  ctx.fillStyle = soot; ctx.fillRect(x0, top, ww, 7 * u);
  const muck = ctx.createLinearGradient(0, bottom - 6 * u, 0, bottom);
  muck.addColorStop(0, 'rgba(22,17,15,0)'); muck.addColorStop(1, 'rgba(22,17,15,0.35)');
  ctx.fillStyle = muck; ctx.fillRect(x0, bottom - 6 * u, ww, 6 * u);
  ctx.globalAlpha = 1; ctx.fillStyle = INK;
  const dots = (yA, yB, n) => { for (let i = 0; i < n; i++) { const r = rand(0.05, 0.16) * u; ctx.fillRect(rand(x0, x1), rand(yA, yB), r * 2, r * 2); } };
  dots(top, top + 5 * u, ww / u * 5 * amt);
  dots(bottom - 4 * u, bottom, ww / u * 7 * amt);
  dots(top, bottom, ww * hh / (u * u) * 0.12 * amt);
  ctx.strokeStyle = INK; ctx.lineWidth = thin * 0.6; ctx.lineCap = 'round';
  for (let i = 0, n = Math.round(ww / (2 * u) * amt); i < n; i++) {
    const x = rand(x0, x1), y = chance(0.5) ? top : rand(top, bottom - 4 * u), len = rand(3, 20) * u;
    ctx.globalAlpha = rand(0.3, 0.7);
    ctx.beginPath(); ctx.moveTo(x, y);
    for (let t = 1; t <= 6; t++) ctx.lineTo(x + Math.sin(t * 1.7 + x) * 0.15 * u, y + len * t / 6);
    ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.lineWidth = thin * 0.9;
  for (let i = 0, n = Math.round(rand(0, 3) * amt); i < n; i++) {
    let x = rand(x0, x1), y = rand(top, bottom);
    ctx.beginPath(); ctx.moveTo(x, y);
    for (let k = 0; k < 6; k++) { x += rand(-0.8, 0.8) * u; y += rand(0.4, 1.4) * u; ctx.lineTo(x, y); }
    ctx.stroke();
  }
  ctx.restore();
}

// scribbled tags at street level
function tags(x0, x1, u) {
  ctx.strokeStyle = INK; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let i = 0, n = Math.random() * 3 | 0; i < n; i++) {
    const x = rand(x0, Math.max(x0, x1 - 5 * u)), y = -rand(1.5, 6) * u, len = rand(2.5, 5) * u, loops = rand(2, 5), amp = rand(0.4, 0.9) * u;
    ctx.lineWidth = LW * rand(0.5, 0.9);
    ctx.beginPath();
    for (let t = 0; t <= 1.001; t += 0.02) {
      const a = t * loops * TAU, px = x + t * len + Math.cos(a) * amp * 0.6, py = y - Math.sin(a) * amp - Math.sin(t * 9) * 0.3 * u;
      if (t) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    }
    ctx.stroke();
    if (chance(0.5)) { ctx.beginPath(); ctx.moveTo(x - 0.3 * u, y + amp * 1.3); ctx.lineTo(x + len + 0.3 * u, y + amp * 1.1); ctx.stroke(); }
  }
}

// ---------- sprites: draw once, then just slide them along ----------

function offscreen(w, h, draw) {
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.ceil(w * dpr)); cv.height = Math.max(1, Math.ceil(h * dpr));
  const main = ctx, b = boil;
  ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); boil = 0;
  draw();
  ctx = main; boil = b;
  return cv;
}

// origin of draw() is the base-left corner; top/bottom are how far it reaches above/below
function makeSprite(w, top, bottom, draw) {
  const pad = 3 * B;
  const cv = offscreen(w + 2 * pad, top + bottom + pad, () => { ctx.translate(pad, top + pad / 2); draw(); });
  return { cv, pad, top: top + pad / 2, w: cv.width / dpr, h: cv.height / dpr };
}
const blit = (s, x, y) => ctx.drawImage(s.cv, x - s.pad, y - s.top, s.w, s.h);

// ---------- buildings ----------

const MIX = ['tower', 'tower', 'slab', 'tenement', 'tenement', 'deco', 'shop', 'workshop'];
const LAYER_DEFS = [
  { s: 0.4, f: 0.1, base: 0.58, fill: '#c9c6bf', flat: true, gap: [-4, 0], types: [...MIX, 'factory', 'factory', 'estate'] },
  { s: 0.55, f: 0.22, base: 0.7, fill: '#dcd5c3', lw: 0.45, gap: [-3, 0], types: [...MIX, 'factory', 'factory', 'estate'] },
  { s: 0.72, f: 0.4, base: 0.84, fill: '#e5dfcc', lw: 0.6, gap: [-2, 0.5], types: [...MIX, 'factory', 'estate', 'estate'] },
  { s: 1, f: 1, base: 1, fill: PAPER, lw: 0.9, gap: [-1, 3], types: [...MIX, 'workshop', 'workshop'], links: true },
];
const WORKSHOP_NAMES = ['VERKSTAD', 'SVETS & SMIDE', 'BILVERKSTAD', 'PLÅTSLAGERI', 'RÖRMOKERI', 'GJUTERI', 'MEK. VERKSTAD', 'DÄCK',
  'SKROT', 'LACKERING', 'SNICKERI', 'MOTORER', 'FJÄDRAR & BULTAR', 'OLJA', 'SLIPERI', 'KYLMONTAGE'];
const SHOP_NAMES = ['BEGAGNADE SYMASKINER', 'TANDTEKNIKER', 'KONSERVATOR', 'PERUKER & POSTISCHER', 'DOCKSJUKHUS', 'SKOMAKARE',
  'SAXSLIPNING', 'NYCKLAR & STÄMPLAR', 'FRIMÄRKEN & MYNT', 'KNAPPAR & BAND', 'HÖRAPPARATER', 'GAMLA RADIOAPPARATER', 'BLANKETTER',
  'KORSETTER', 'PARAPLYREPARATIONER', 'AKVARIEFISKAR', 'BEGRAVNINGSBYRÅ', 'KORV & LOTTER', 'GLASÖGON & BAROMETRAR', 'REMMAR & SELAR',
  'SPÅKVINNA', 'PANTBANK', 'ORTOPEDISKA SKOR', 'BADRUMSVÅGAR', 'HATTMAKARE', 'TOBAK & FISKEDRAG', 'RAMAR & SPEGLAR', 'DAMMSUGARSERVICE',
  'KAMERAREPARATIONER', 'ÄGG & SMÖR', 'BOKBINDERI', 'GRAVSTENAR', 'SKÖLDPADDOR & TILLBEHÖR', 'UNIFORMER', 'MANNEKÄNGER', 'PIANOSTÄMNING',
  'LIKKISTOR', 'SPELKORT & TÄRNINGAR', 'MEDALJER & POKALER', 'URMAKARE', 'KORV', 'TOBAK', 'FRISÖR', 'KIOSK', 'LOTTO', 'PANT'];
const ODD_THINGS = ['fish', 'clock', 'teeth', 'head', 'boot', 'bottle', 'key', 'eye', 'cat', 'hat', 'glasses'];
const HANGING = ['boot', 'key', 'fish', 'teeth', 'glasses', 'hat', 'clock', 'eye'];
const DIMS = { tower: [14, 26, 38, 95], slab: [24, 38, 20, 50], tenement: [12, 20, 18, 40], deco: [18, 30, 55, 110], shop: [9, 15, 11, 19], workshop: [14, 24, 9, 15], factory: [30, 46, 12, 22], estate: [44, 70, 38, 66] };

function spawnBuilding(lay) {
  const L = lay.L, u = B * L.s, type = pick(L.types), d = DIMS[type];
  const b = { type, L, u, w: rand(d[0], d[1]) * u, h: rand(d[2], d[3]) * u, seed: rand(0, 1000), stacks: [] };
  if (['tower', 'slab', 'deco'].includes(type) && chance(0.2)) b.h *= rand(1.25, 1.6); // the odd giant
  const tall = () => (chance(0.3) ? rand(75, 115) : rand(32, 58)) * u;
  if (type === 'factory') {
    const hw = b.w * 0.7, n = 1 + (Math.random() * 3 | 0);
    for (let i = 0; i < n; i++) b.stacks.push({ x: hw * (n === 1 ? rand(0.3, 0.7) : 0.15 + i * 0.7 / (n - 1)), y: -tall(), w: rand(2.4, 3.6) * u, dark: chance(0.5), t: rand(0, 0.4) });
  } else if (type === 'workshop') {
    b.roof = pick(['shed', 'gable', 'saw']);
    b.stacks.push({ x: b.w * rand(0.15, 0.85), y: -b.h - rand(5, 9) * u, w: 0.9 * u, dark: chance(0.7), t: rand(0, 1), small: true, vent: true }); // stovepipe
  } else if (type === 'tenement') {
    for (const f of [0.2, 0.7]) b.stacks.push({ x: b.w * f + 0.8 * u, y: -b.h - 4 * u, w: 1.6 * u, dark: chance(0.3), t: rand(0, 2), small: true });
  } else if (type !== 'deco' && chance(0.6)) { // a smoking vent on the roof
    b.stacks.push({ x: b.w * rand(0.15, 0.85), y: -b.h - rand(3, 5) * u, w: 1.2 * u, dark: chance(0.4), t: rand(0, 2), small: true, vent: true });
  }
  // pipes and cables strung across the alley to the next building
  b.fence = L.links && chance(0.5);
  b.links = !L.links ? [] : Array.from({ length: 3 + (Math.random() * 5 | 0) }, () => chance(0.65)
    ? { pipe: true, y0: rand(0.05, 0.6), y1: rand(0.05, 0.6), d: rand(0.5, 1.3) * u, jog: rand(0.25, 0.75) }
    : { pipe: false, y0: rand(0.1, 0.95), y1: rand(0.1, 0.95), sag: rand(0.5, 4) * u });
  const top = Math.max(b.h + 20 * u, ...b.stacks.map((s) => -s.y + 2 * u));
  b.sprite = makeSprite(b.w, top, B, () => { LW = B * 0.3 * (L.lw || 1); renderBuilding(b); if (!L.flat) tags(0, b.w, u); LW = B * 0.3; });
  b.x = lay.cursor;
  lay.items.push(b);
  lay.cursor += b.w + rand(L.gap[0], L.gap[1]) * u;
}

function renderBuilding(b) {
  const { type, L, u, w, h, seed } = b, fill = L.fill, thin = LW * 0.45;

    s.items.push(it);
    s.cursor += (it.len || 0) + rand(s.gap[0], s.gap[1]) * B;
  }
}
function updateStream(s, dt) {
  s.cursor += s.cursorSv * dt;
  for (const it of s.items) it.x += it.sv * dt;
  s.items = s.items.filter((it) => it.x > -40 * B);
  fillStream(s);
}

// ---------- smoke ----------

function updateSmoke(dt) {
  for (const lay of layers) {
    const u = B * lay.L.s;
    for (const b of lay.items) {
      for (const s of b.stacks) {
        const x = b.x + s.x;
        if ((s.t -= dt) > 0 || x < -20 * B || x > W + 20 * B) continue;
        s.t = (s.small ? rand(0.35, 0.7) : rand(0.12, 0.22)) / (lay.L.s * lay.L.s); // distant chimneys puff less often
        lay.puffs.push({ x: x + rand(-0.2, 0.2) * s.w, y: lay.base + s.y, r: s.w * 0.65, vx: rand(0.8, 1.8) * u, vy: -rand(1.5, 2.8) * u,
          grow: (s.small ? 0.7 : 1.3) * u, age: 0, life: s.small ? rand(3.5, 5.5) : rand(6, 10), dark: s.dark, seed: rand(0, 1000) });
      }
    }
    for (const p of lay.puffs) { p.age += dt; p.x += (p.vx - SPEED * lay.L.f) * dt; p.y += p.vy * dt * (1 - p.age / p.life * 0.6); p.r += p.grow * dt; }
    lay.puffs = lay.puffs.filter((p) => p.age < p.life && p.x > -30 * B);
  }
}

// puffs are pre-drawn in a few sizes and shapes (tracing hundreds of ink outlines every frame is too slow)
const PUFF_SIZES = [8, 16, 32, 64, 128], PUFF_SHAPES = 4;
let puffSprites;
function buildPuffSprites() {
  const kinds = { flat: ['#bdb9b2', false], light: [PAPER, true], dark: ['#5f5a55', true] };
  puffSprites = {};
  for (const [name, [fill, outline]] of Object.entries(kinds)) {
    puffSprites[name] = PUFF_SIZES.map((r) => Array.from({ length: PUFF_SHAPES }, (_, v) => {
      const pad = r * 0.25 + 2, size = 2 * (r + pad);
      return { r, size, cv: offscreen(size, size, () => ink(ellPts(r + pad, r + pad, r, r * 0.85, { lump: 0.12, seed: v * 17.3 }), { fill, w: outline ? LW * 0.55 : 0 })) };
    }));
  }
}

function drawSmoke(lay) {
  for (const p of lay.puffs) {
    const set = puffSprites[lay.L.flat ? 'flat' : p.dark ? 'dark' : 'light'];
    let i = 0; while (i < PUFF_SIZES.length - 1 && PUFF_SIZES[i] < p.r) i++;
    const spr = set[i][(p.seed | 0) % PUFF_SHAPES], k = p.r / spr.r, size = spr.size * k;
    ctx.globalAlpha = Math.min(1, p.age * 3) * Math.min(1, 2 - 2 * p.age / p.life);
    ctx.drawImage(spr.cv, p.x - size / 2, p.y - size / 2, size, size);
  }
  ctx.globalAlpha = 1;
}

// ---------- setup ----------

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  c.width = W * dpr; c.height = H * dpr;
  B = H * 0.01; LW = B * 0.3; SPEED = 6 * B;

  buildPuffSprites();
  layers = LAYER_DEFS.map((L) => ({ L, base: H * L.base, items: [], puffs: [], cursor: -rand(0, 20) * B * L.s }));
  for (const lay of layers) while (lay.cursor < W + 10 * B) spawnBuilding(lay);
  for (let i = 0; i < 120; i++) updateSmoke(0.05);

  streams = { poles: makeStream([14, 24], -SPEED * POLE_F, makePole) };
}

// pipes and cables across the alleys between neighbouring front buildings
function drawLinks(lay) {
  const items = lay.items;
  for (let i = 0; i + 1 < items.length; i++) {
    const a = items[i], b = items[i + 1], u = a.u, x0 = a.x + a.w, x1 = b.x, top = Math.min(a.h, b.h) * 0.92;
    if (x1 - x0 < 0.5 * u) continue;
    if (a.fence && x1 - x0 > 2 * u) { // mesh fence across the alley, wire on top
      const prev = boil, fh = 6 * u, top = lay.base - fh, gw = x1 - x0;
      boil = 0;
      for (const ang of [0.8, -0.8]) hatch([() => ctx.rect(x0, top, gw, fh)], x0 + gw / 2, top + fh / 2, gw + fh, ang, 0.6 * u, LW * 0.3, 7);
      for (let i = 0, n = Math.max(1, Math.round(gw / (3 * u))); i <= n; i++) line(x0 + gw * i / n, lay.base, x0 + gw * i / n, top - 1.6 * u, LW * 0.8);
      line(x0, top, x1, top, LW * 0.7);
      barbedWire(x0, top - 0.7 * u, x1, top - 0.7 * u, 0.3 * u, 0.8 * u);
      barbedWire(x0, top - 1.4 * u, x1, top - 1.4 * u, 0.3 * u, 0.8 * u);
      razorWire(x0, x1, top - 1.6 * u, 0.9 * u);
      boil = prev;
    }
    for (const l of a.links) {
      const y0 = lay.base - l.y0 * top, y1 = lay.base - l.y1 * top;
      if (!l.pipe) { cable(x0, y0, x1, y1, l.sag, LW * 0.5); continue; }
      const jx = x0 + (x1 - x0) * l.jog;
      pipeLine([[x0 - 0.6 * u, y0], [jx, y0], [jx, y1], [x1 + 0.6 * u, y1]], l.d);
      ctx.fillStyle = PAPER; ctx.strokeStyle = INK; ctx.lineWidth = LW * 0.5;
      for (const [fx, fy] of [[x0 + 0.4 * u, y0], [x1 - 0.4 * u, y1]]) { ctx.beginPath(); ctx.rect(fx - 0.25 * u, fy - l.d * 0.9, 0.5 * u, l.d * 1.8); ctx.fill(); ctx.stroke(); }
    }
  }
}

function drawWires() {
  const poles = streams.poles.items;
  poles.forEach((p, i) => {
    const q = poles[i + 1];
    if (q) for (const [ax, ay] of p.attach) cable(p.x + ax, p.y + ay, q.x + ax, q.y + ay, 2.5 * B);
    for (const d of p.drops) { const [ax, ay] = p.attach[d.a]; cable(p.x + ax, p.y + ay, p.x + 4 * p.U + d.dx, H - d.h, d.sag); }
  });
}

// ---------- frame ----------

function update(time, dt) {
  for (const lay of layers) {
    const dx = SPEED * lay.L.f * dt;
    for (const b of lay.items) b.x -= dx;
    lay.cursor -= dx;
    lay.items = lay.items.filter((b) => b.x + b.w + 5 * B > 0);
    while (lay.cursor < W + 10 * B) spawnBuilding(lay);
  }
  updateSmoke(dt);
  for (const s of Object.values(streams)) updateStream(s, dt);
}

function frame(time) {
  boil = Math.floor(time * 9);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = SKY; ctx.fillRect(0, 0, W, H);
  layers.forEach((lay, i) => {
    for (const b of lay.items) blit(b.sprite, b.x, lay.base);
    // fill in under each layer, so nearer gaps show a solid mass of town rather than floating buildings
    if (lay.base < H) { ctx.fillStyle = lay.L.fill; ctx.fillRect(0, lay.base, W, H - lay.base); }
    if (lay.L.links) drawLinks(lay);
    drawSmoke(lay);
    if (i === layers.length - 2) {
      for (const it of streams.poles.items) blit(it.sprite, it.x, it.y);
      drawWires();
    }
  });

  const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.15)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const time = now / 1000;
  update(time, dt);
  frame(time);
  requestAnimationFrame(loop);
}

addEventListener('resize', resize);
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
